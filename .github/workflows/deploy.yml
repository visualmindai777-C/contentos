# Despliega todo desde GitHub: API en Render (free), Worker y portal en Cloudflare. Tú solo cargas los secrets
# de abajo una vez; el workflow calcula las URLs, crea el servicio de Render, reparte los secretos a cada servicio y espera a que
# la API responda.
#
# Interruptor: variable DEPLOY_ENABLED=true (sin ella el workflow no hace nada).
#
# Secrets de GitHub:
#   CLOUDFLARE_API_TOKEN   permisos de cuenta: Workers Scripts (Edit), Workers R2 Storage (Edit), Account Settings (Read)
#   CLOUDFLARE_ACCOUNT_ID
#   RENDER_API_KEY         clave de API de Render (Account Settings > API Keys)
#   WORKER_GITHUB_TOKEN    token fine-grained de GitHub con "Actions: Read and write" sobre este repositorio
#   DATABASE_URL           (ya cargado: lo usa también la API en Render)
#   API_KEY                clave compartida API ↔ portal ↔ Worker
#   ARTIFACT_SECRET        firma de las URLs de descarga (API ↔ Worker)
#   PORTAL_PASSWORD        contraseña de acceso al portal (usuario: admin)
name: deploy

on:
  push:
    branches: [main]
    paths: ["cloudflare/**", "frontend/**", "backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICE_NAME: contentos-api
  WORKER_NAME: contentos-worker

jobs:
  changes:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.diff.outputs.worker }}
      portal: ${{ steps.diff.outputs.portal }}
      space: ${{ steps.diff.outputs.space }}
      any: ${{ steps.diff.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          # Sin commit anterior (primer push) o a mano se despliega todo
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || ! git rev-parse -q --verify HEAD^ > /dev/null; then
            files=$(printf 'cloudflare/\nfrontend/\nbackend/\n')
          else
            files=$(git diff --name-only HEAD^ HEAD)
          fi
          any=false
          for pair in cloudflare:worker frontend:portal backend:space; do
            if echo "$files" | grep -q "^${pair%%:*}/"; then
              echo "${pair##*:}=true" >> "$GITHUB_OUTPUT"; any=true
            else
              echo "${pair##*:}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

  # La URL de la API la fija Render al crear el servicio, así que esta etapa lo crea (o lo encuentra) y la publica:
  # el Worker y el portal la necesitan para desplegarse. Si backend/ cambió, además lanza un deploy.
  api:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backend_url: ${{ steps.svc.outputs.backend_url }}
      worker_url: ${{ steps.urls.outputs.worker_url }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_SUBDOMAIN: ${{ vars.CF_SUBDOMAIN }}
    steps:
      - id: urls
        run: |
          : "${RENDER_API_KEY:?Falta el secret RENDER_API_KEY}" "${CF_TOKEN:?Falta el secret CLOUDFLARE_API_TOKEN}" "${CF_ACCOUNT:?Falta CLOUDFLARE_ACCOUNT_ID}"
          sub="${CF_SUBDOMAIN:-}"
          [ -n "$sub" ] || sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
          [ -n "$sub" ] || { echo "::error::Falta el subdominio workers.dev: define la variable CF_SUBDOMAIN"; exit 1; }
          echo "worker_url=https://${WORKER_NAME}.${sub}.workers.dev" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Crear el servicio de Render si no existe
        id: svc
        run: |
          render() { curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" "$@"; }
          id=$(render "https://api.render.com/v1/services?name=${SERVICE_NAME}&limit=20" | jq -r --arg n "$SERVICE_NAME" '[.[].service | select(.name==$n)][0].id // empty')
          if [ -z "$id" ]; then
            owner=$(render "https://api.render.com/v1/owners?limit=1" | jq -r '.[0].owner.id')
            body=$(jq -n --arg n "$SERVICE_NAME" --arg o "$owner" --arg r "https://github.com/${GITHUB_REPOSITORY}" '{
              type:"web_service", name:$n, ownerId:$o, repo:$r, branch:"main", rootDir:"backend", autoDeploy:"no",
              serviceDetails:{runtime:"docker", plan:"free", region:"oregon", healthCheckPath:"/health",
                envSpecificDetails:{dockerfilePath:"./Dockerfile", dockerContext:"."}}}')
            id=$(render -X POST https://api.render.com/v1/services -d "$body" | jq -r '.service.id')
            echo "Servicio creado: $id"
          fi
          url=$(render "https://api.render.com/v1/services/$id" | jq -r '.serviceDetails.url')
          { echo "id=$id"; echo "backend_url=$url"; } >> "$GITHUB_OUTPUT"
          echo "API: $url"

      - name: Variables de entorno de la API
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          ARTIFACT_SECRET: ${{ secrets.ARTIFACT_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          WORKER_URL: ${{ steps.urls.outputs.worker_url }}
          SERVICE_ID: ${{ steps.svc.outputs.id }}
        run: |
          : "${DATABASE_URL:?Falta DATABASE_URL}" "${API_KEY:?Falta API_KEY}" "${ARTIFACT_SECRET:?Falta ARTIFACT_SECRET}" "${R2_SECRET_ACCESS_KEY:?Falta R2_SECRET_ACCESS_KEY}"
          jq -n --arg d "$DATABASE_URL" --arg a "$API_KEY" --arg s "$ARTIFACT_SECRET" --arg w "${WORKER_URL}/artifacts" --arg ra "$R2_ACCOUNT_ID" --arg rk "$R2_ACCESS_KEY_ID" --arg rs "$R2_SECRET_ACCESS_KEY" '[{key:"DATABASE_URL",value:$d},{key:"API_KEY",value:$a},{key:"ARTIFACT_SECRET",value:$s},{key:"ASSETS_BASE_URL",value:$w},{key:"PORT",value:"7860"},{key:"R2_ACCOUNT_ID",value:$ra},{key:"R2_ACCESS_KEY_ID",value:$rk},{key:"R2_SECRET_ACCESS_KEY",value:$rs}]' |
          curl -fsS -X PUT "https://api.render.com/v1/services/${SERVICE_ID}/env-vars"             -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" -d @- > /dev/null
          echo "variables cargadas"

      - name: Desplegar y esperar a que la API responda
        env:
          SERVICE_ID: ${{ steps.svc.outputs.id }}
          BACKEND_URL: ${{ steps.svc.outputs.backend_url }}
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys"             -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" -d '{}' > /dev/null
          for _ in $(seq 1 150); do
            if curl -fsS -m 15 "${BACKEND_URL}/health" | grep -q '"ok"'; then echo "API activa: ${BACKEND_URL}"; exit 0; fi
            sleep 10
          done
          echo "::error::La API no respondió en 25 minutos. Revisa el deploy en https://dashboard.render.com"
          exit 1

  worker:
    needs: [changes, api]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Configurar URLs
        env:
          BACKEND_URL: ${{ needs.api.outputs.backend_url }}
        run: |
          sed -i "s|https://CONTENTOS-API.onrender.com|${BACKEND_URL}|; s|usuario/repositorio|${GITHUB_REPOSITORY}|" wrangler.toml
          grep -E '^(BACKEND_URL|GITHUB_REPO)' wrangler.toml
      - run: npm ci
      - run: npm test && npm run typecheck
      - run: npm run deploy
      - name: Secretos del Worker
        env:
          API_KEY: ${{ secrets.API_KEY }}
          GH_TOKEN_FOR_WORKER: ${{ secrets.WORKER_GITHUB_TOKEN }}
          ARTIFACT_SECRET: ${{ secrets.ARTIFACT_SECRET }}
        run: |
          : "${API_KEY:?Falta API_KEY}" "${GH_TOKEN_FOR_WORKER:?Falta WORKER_GITHUB_TOKEN}" "${ARTIFACT_SECRET:?Falta ARTIFACT_SECRET}"
          jq -n --arg a "$API_KEY" --arg g "$GH_TOKEN_FOR_WORKER" --arg s "$ARTIFACT_SECRET" \
            '{API_KEY:$a, GITHUB_TOKEN:$g, ARTIFACT_SECRET:$s}' > "$RUNNER_TEMP/worker-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

  portal:
    needs: [changes, api]
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configurar URLs
        env:
          BACKEND_URL: ${{ needs.api.outputs.backend_url }}
          WORKER_URL: ${{ needs.api.outputs.worker_url }}
        run: |
          sed -i "s|https://CONTENTOS-API.onrender.com|${BACKEND_URL}|; s|https://contentos-worker.CUENTA.workers.dev|${WORKER_URL}|" wrangler.jsonc
          grep -E 'BACKEND_URL|WORKER_URL' wrangler.jsonc
      - run: npm ci
      - run: npm test
      - run: npm run cf:deploy
      - name: Secretos del portal
        env:
          API_KEY: ${{ secrets.API_KEY }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
        run: |
          : "${API_KEY:?Falta API_KEY}" "${PORTAL_PASSWORD:?Falta PORTAL_PASSWORD}"
          jq -n --arg a "$API_KEY" --arg p "$PORTAL_PASSWORD" '{API_KEY:$a, PORTAL_USER:"admin", PORTAL_PASSWORD:$p}' > "$RUNNER_TEMP/portal-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/portal-secrets.json"
          rm -f "$RUNNER_TEMP/portal-secrets.json"
