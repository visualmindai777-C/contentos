# Despliega todo desde GitHub: API en HuggingFace Spaces, Worker y portal en Cloudflare. Tú solo cargas los secrets
# de abajo una vez; el workflow calcula las URLs, crea el Space, reparte los secretos a cada servicio y espera a que
# la API responda.
#
# Interruptor: variable DEPLOY_ENABLED=true (sin ella el workflow no hace nada).
#
# Secrets de GitHub:
#   CLOUDFLARE_API_TOKEN   permisos de cuenta: Workers Scripts (Edit), Workers R2 Storage (Edit), Account Settings (Read)
#   CLOUDFLARE_ACCOUNT_ID
#   HF_TOKEN               token de Hugging Face con permiso de escritura
#   WORKER_GITHUB_TOKEN    token fine-grained de GitHub con "Actions: Read and write" sobre este repositorio
#   DATABASE_URL           (ya cargado: lo usa también la API en el Space)
#   API_KEY                clave compartida API ↔ portal ↔ Worker
#   ARTIFACT_SECRET        firma de las URLs de descarga (API ↔ Worker)
#   PORTAL_PASSWORD        contraseña de acceso al portal (usuario: admin)
name: deploy

on:
  push:
    branches: [main]
    paths: ["cloudflare/**", "frontend/**", "backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SPACE_NAME: contentos-api
  WORKER_NAME: contentos-worker

jobs:
  changes:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.diff.outputs.worker }}
      portal: ${{ steps.diff.outputs.portal }}
      space: ${{ steps.diff.outputs.space }}
      any: ${{ steps.diff.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          # Sin commit anterior (primer push) o a mano se despliega todo
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || ! git rev-parse -q --verify HEAD^ > /dev/null; then
            files=$(printf 'cloudflare/\nfrontend/\nbackend/\n')
          else
            files=$(git diff --name-only HEAD^ HEAD)
          fi
          any=false
          for pair in cloudflare:worker frontend:portal backend:space; do
            if echo "$files" | grep -q "^${pair%%:*}/"; then
              echo "${pair##*:}=true" >> "$GITHUB_OUTPUT"; any=true
            else
              echo "${pair##*:}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

  # Las URLs de unos servicios las necesitan los otros (la API firma enlaces del Worker, el portal llama a la API...)
  urls:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hf_user: ${{ steps.u.outputs.hf_user }}
      backend_url: ${{ steps.u.outputs.backend_url }}
      worker_url: ${{ steps.u.outputs.worker_url }}
    steps:
      - id: u
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${HF_TOKEN:?Falta el secret HF_TOKEN}" "${CF_TOKEN:?Falta el secret CLOUDFLARE_API_TOKEN}" "${CF_ACCOUNT:?Falta CLOUDFLARE_ACCOUNT_ID}"
          hf_user=$(curl -fsS -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2 | jq -r '.name // empty')
          [ -n "$hf_user" ] || { echo "::error::HF_TOKEN no es válido: no se pudo leer el usuario de Hugging Face"; exit 1; }
          # Los Spaces se sirven en https://<usuario>-<space>.hf.space (minúsculas, '_' → '-')
          host=$(echo "${hf_user}-${SPACE_NAME}" | tr 'A-Z_' 'a-z-')
          sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')
          [ -n "$sub" ] || { echo "::error::Tu cuenta de Cloudflare no tiene subdominio workers.dev. Créalo en Workers & Pages (te lo pide al abrir la sección) o revisa los permisos del token (Account Settings: Read)."; exit 1; }
          {
            echo "hf_user=$hf_user"
            echo "backend_url=https://${host}.hf.space"
            echo "worker_url=https://${WORKER_NAME}.${sub}.workers.dev"
          } >> "$GITHUB_OUTPUT"

  worker:
    needs: [changes, urls]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Configurar URLs
        env:
          BACKEND_URL: ${{ needs.urls.outputs.backend_url }}
        run: |
          sed -i "s|https://USUARIO-SPACE.hf.space|${BACKEND_URL}|; s|usuario/repositorio|${GITHUB_REPOSITORY}|" wrangler.toml
          grep -E '^(BACKEND_URL|GITHUB_REPO)' wrangler.toml
      - run: npm ci
      - run: npm test && npm run typecheck
      - run: npm run deploy
      - name: Secretos del Worker
        env:
          API_KEY: ${{ secrets.API_KEY }}
          GH_TOKEN_FOR_WORKER: ${{ secrets.WORKER_GITHUB_TOKEN }}
          ARTIFACT_SECRET: ${{ secrets.ARTIFACT_SECRET }}
        run: |
          : "${API_KEY:?Falta API_KEY}" "${GH_TOKEN_FOR_WORKER:?Falta WORKER_GITHUB_TOKEN}" "${ARTIFACT_SECRET:?Falta ARTIFACT_SECRET}"
          jq -n --arg a "$API_KEY" --arg g "$GH_TOKEN_FOR_WORKER" --arg s "$ARTIFACT_SECRET" \
            '{API_KEY:$a, GITHUB_TOKEN:$g, ARTIFACT_SECRET:$s}' > "$RUNNER_TEMP/worker-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

  portal:
    needs: [changes, urls]
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configurar URLs
        env:
          BACKEND_URL: ${{ needs.urls.outputs.backend_url }}
          WORKER_URL: ${{ needs.urls.outputs.worker_url }}
        run: |
          sed -i "s|https://USUARIO-SPACE.hf.space|${BACKEND_URL}|; s|https://contentos-worker.CUENTA.workers.dev|${WORKER_URL}|" wrangler.jsonc
          grep -E 'BACKEND_URL|WORKER_URL' wrangler.jsonc
      - run: npm ci
      - run: npm test
      - run: npm run cf:deploy
      - name: Secretos del portal
        env:
          API_KEY: ${{ secrets.API_KEY }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
        run: |
          : "${API_KEY:?Falta API_KEY}" "${PORTAL_PASSWORD:?Falta PORTAL_PASSWORD}"
          jq -n --arg a "$API_KEY" --arg p "$PORTAL_PASSWORD" '{API_KEY:$a, PORTAL_USER:"admin", PORTAL_PASSWORD:$p}' > "$RUNNER_TEMP/portal-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/portal-secrets.json"
          rm -f "$RUNNER_TEMP/portal-secrets.json"

  space:
    needs: [changes, urls]
    if: needs.changes.outputs.space == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USER: ${{ needs.urls.outputs.hf_user }}
      BACKEND_URL: ${{ needs.urls.outputs.backend_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Crear el Space si no existe
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/create.json" -w "%{http_code}" -X POST https://huggingface.co/api/repos/create \
            -H "Authorization: Bearer $HF_TOKEN" -H "Content-Type: application/json" \
            -d "{\"type\":\"space\",\"name\":\"${SPACE_NAME}\",\"sdk\":\"docker\",\"private\":false}")
          case "$code" in
            200|201) echo "Space creado" ;;
            409) echo "El Space ya existe" ;;
            *) echo "::error::No se pudo crear el Space (HTTP $code): $(head -c 300 "$RUNNER_TEMP/create.json")"; exit 1 ;;
          esac

      # Los secretos van antes del código: el primer build ya los encuentra
      - name: Secretos del Space
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          ARTIFACT_SECRET: ${{ secrets.ARTIFACT_SECRET }}
          WORKER_URL: ${{ needs.urls.outputs.worker_url }}
        run: |
          : "${DATABASE_URL:?Falta DATABASE_URL}" "${API_KEY:?Falta API_KEY}" "${ARTIFACT_SECRET:?Falta ARTIFACT_SECRET}"
          set_secret() {
            curl -fsS -X POST "https://huggingface.co/api/spaces/${HF_USER}/${SPACE_NAME}/secrets" \
              -H "Authorization: Bearer $HF_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg k "$1" --arg v "$2" '{key:$k, value:$v}')" > /dev/null && echo "secret $1 cargado"
          }
          set_secret DATABASE_URL "$DATABASE_URL"
          set_secret API_KEY "$API_KEY"
          set_secret ARTIFACT_SECRET "$ARTIFACT_SECRET"
          set_secret ASSETS_BASE_URL "${WORKER_URL}/artifacts"

      # El Space es un repo git propio cuya raíz es backend/ (Dockerfile + README.md con el front-matter del Space)
      - name: Sincronizar backend/ con el Space
        run: |
          git clone --depth 1 "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/${SPACE_NAME}" space
          rsync -a --delete --exclude .git --exclude tests --exclude scripts --exclude __pycache__ backend/ space/
          cd space
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Sync desde ${GITHUB_SHA}" && git push; fi

      - name: Esperar a que la API responda
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS -m 10 "${BACKEND_URL}/health" | grep -q '"ok"'; then echo "API activa: ${BACKEND_URL}"; exit 0; fi
            sleep 10
          done
          echo "::error::La API no respondió en 15 minutos. Revisa el build del Space: https://huggingface.co/spaces/${HF_USER}/${SPACE_NAME}"
          exit 1
