# Pruebas del backend con un Postgres real. Se ejecutan en cada pull request, a mano, y como paso previo del despliegue
# (deploy.yml las llama): si fallan, no se despliega nada.
name: tests

on:
  pull_request:
    paths: ["backend/**", "db/**", ".github/workflows/tests.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contentos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/contentos
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/contentos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Paquetes del sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core postgresql-client
      - name: Esquema de la base de datos
        run: psql "postgresql://postgres:postgres@localhost:5432/contentos" -v ON_ERROR_STOP=1 -q -f db/schema.sql
      - name: Dependencias
        working-directory: backend
        run: pip install -e ".[dev]" langgraph opencv-python-headless numpy pillow
      - name: Pruebas
        working-directory: backend
        run: python -m pytest -q
