name = "contentos-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# 1) cada 15 min: ¿hay contenidos en cola? → lanza el pipeline solo si los hay (y mantiene despiertos HF y Supabase)
# 2) cada 8 h: contenido nuevo a partir de tendencias. Mantener este cron igual que FRESH_CRON en src/index.ts
[triggers]
crons = ["*/15 * * * *", "17 */8 * * *"]

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "contentos"

[vars]
BACKEND_URL = "https://USUARIO-SPACE.hf.space" # sin barra final
GITHUB_REPO = "usuario/repositorio"
GITHUB_REF = "main"
FRESH_LIMIT = "3"

# Secrets (wrangler secret put <NOMBRE>): API_KEY, GITHUB_TOKEN, ARTIFACT_SECRET
